name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate versions and notes
        id: metadata
        run: python scripts/release_artifacts.py metadata
      - name: Reject an existing tag for a different commit
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA" || {
              echo "::error::This version tag already identifies another commit. Bump the app version."
              exit 1
            }
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            accelerator: directml
          - os: ubuntu-22.04
            platform: linux-x64
            accelerator: cpu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the backend (Windows)
        if: runner.os == 'Windows'
        working-directory: backend
        run: >
          uv sync --locked --no-dev --group packaging --extra desktop
          --extra ${{ matrix.accelerator }} --extra whisper --extra qwen
      - name: Install the backend with CPU PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          read -r -a excluded <<< "$(uv run --no-project --python 3.13 python -c 'import tomllib; from pathlib import Path; d=tomllib.loads(Path("backend/uv.lock").read_text()); print(" ".join(p["name"] for p in d["package"] if p["name"] == "torch" or p["name"] == "triton" or p["name"].startswith(("nvidia-", "cuda-"))))')"
          skip=()
          for package in "${excluded[@]}"; do skip+=(--no-install-package "$package"); done
          uv sync --project backend --locked --no-dev --group packaging --extra desktop --extra cpu --extra whisper --extra qwen "${skip[@]}"
          torch_version=$(uv run --no-project --python 3.13 python -c 'import tomllib; from pathlib import Path; d=tomllib.loads(Path("backend/uv.lock").read_text()); print(next(p["version"] for p in d["package"] if p["name"] == "torch"))')
          uv pip install --python backend/.venv/bin/python --no-deps --index https://download.pytorch.org/whl/cpu "torch==$torch_version"
      - name: Restore DirectML after Whisper's CPU runtime dependency
        if: runner.os == 'Windows'
        run: |
          uv pip uninstall --python backend/.venv/Scripts/python.exe onnxruntime
          uv pip install --python backend/.venv/Scripts/python.exe --no-deps --reinstall-package onnxruntime-directml \
            "onnxruntime-directml==$(uv run --project backend --no-sync python -c 'import importlib.metadata as m; print(m.version("onnxruntime-directml"))')"
          uv run --project backend --no-sync python -c 'import onnxruntime as o; assert "DmlExecutionProvider" in o.get_available_providers()'
      - name: Package
        run: uv run --project backend --no-sync python scripts/package_release.py --full
      - name: Archive and checksum
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: uv run --project backend --no-sync python scripts/release_artifacts.py archive --platform "$RELEASE_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            Video-Flow-*.zip
            Video-Flow-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Tag and publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify both artifacts and prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes gather every version since the newest published release.
          released=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          python scripts/release_artifacts.py verify --released $released
      - name: Create version tag after successful builds
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Video-Flow ${RELEASE_TAG#v}"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.name }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/Video-Flow-*.zip
            dist/Video-Flow-*.zip.sha256
